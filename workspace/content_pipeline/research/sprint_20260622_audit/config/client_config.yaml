client:
  slug: "hogeye"
  display_name: "HogEye Cameras"
  website: "https://hogeyecameras.com/"
  organization_type: "Cellular / solar off-grid ranch and wildlife camera systems (WordPress marketing site)"
  trust_sensitive: true
  primary_locations:
    - "United States — English; rural Southern and Delta regions emphasized in content strategy (e.g. Texas, Mississippi, Louisiana, Arkansas, Florida, Oklahoma, Alabama, Georgia; Mississippi Delta / Mississippi River area)"

business_context:
  business_goals:
    - "Drive purchases and strong buy-now intent for HogEye camera systems"
    - "Grow topical authority in feral hog monitoring, cellular ranch cameras, off-grid surveillance, and smart ranch monitoring"
    - "Grow organic traffic from comparison, how-to, cost, setup, and problem/solution queries"
    - "Support buyer education and conversion for ranch and trap-monitoring use cases"
  primary_conversions:
    - "Buy Now page visits / product purchase intent (primary funnel per content strategy)"
  secondary_conversions:
    - "Contact / inquiry actions"
    - "App or product interest from comparison and educational content"
    - "Case study engagement (when published)"
  target_audiences:
    - "Trappers and hog-control operators (trap-trigger and capture workflows)"
    - "Ranchers and landowners"
    - "Wildlife managers"
    - "Agricultural producers and property owners"
    - "Rural security users (gates, trespass, equipment, feeders, livestock zones)"
  priority_services_or_topics:
    - "Live video, real-time monitoring, remote triggers"
    - "Solar reliability and off-grid / ranch-grade use"
    - "Feral hog monitoring and hog-control workflows"
    - "Cellular ranch cameras and smart ranch monitoring"
  differentiators:
    - "Positioning on live video, real-time monitoring, remote triggers, solar reliability, ranch-grade / off-grid use (per strategy briefs)"
    - "Field-tested, practical authority vs generic consumer security tone"
  local_seo_relevance: "Primarily US national with strong regional relevance to Southern and Delta states; confirm local landing pages vs blog-only geo targeting."
  content_notes:
    - "Content strategy funnels users to Buy Now; verify live conversion events in GA4/GTM when access is available."
    - "Boar Blanket may be a related but separate brand; September category brief mentions linking for differentiation — confirm cross-brand scope for internal linking and measurement."
  notes: >
    Trust sensitivity treated as moderate (not full YMYL): product and operational
    monitoring focus; some content may touch disease risk or livestock protection
    in an educational framing — not medical/legal diagnosis. Primary production
    domain for the audit is hogeyecameras.com. Staging at staging.hogeyecameras.com
    is out of scope for performance/indexation unless explicitly checking leakage
    or canonical issues; staging HTML has been observed self-canonicalizing to
    staging on at least one page. Stack (from staging observation): WordPress,
    AIOSEO Pro, MonsterInsights, Astra, Beaver Builder — confirm production parity.

analysis_scope:
  included_properties:
    - "https://hogeyecameras.com/"
  excluded_properties:
    - "https://staging.hogeyecameras.com/ (except audits of indexation, canonical leakage, or staging vs production consistency when scoped)"
    - "External partner or client sites"
    - "Other brands except as competitor references or where cross-brand strategy is in scope (e.g. Boar Blanket — confirm)"
  competitors:
    - "Vosker"
    - "Reolink (incl. Reolink Go PT Plus / Go Ranger PT where relevant)"
    - "Barn Owl / RangeCam"
    - "Spartan (search competitor set per November content brief)"
  markets:
    - "United States"
    - "English only (per available materials)"
    - "Priority geographies in content: Texas, Mississippi, Louisiana, Arkansas, Florida, Oklahoma, Alabama, Georgia; Mississippi Delta / Mississippi River region"
  date_range: "Default: last 90 days for current-state SEO and content opportunity review; last 28 days for near-term performance checks; YoY when the property has enough history (audit recommendation, not from client docs)."
  constraints:
    - "Do not treat staging as performance baseline; flag staging canonical/indexation risks."
    - "Recommendations should respect WordPress + AIOSEO + Beaver Builder implementation reality."
    - "Do not invent metrics, events, or GSC/GA properties — confirm access and containers."
  technical_constraints:
    - "WordPress with AIOSEO Pro, MonsterInsights, Astra, Beaver Builder observed on staging — verify production stack and editability."

